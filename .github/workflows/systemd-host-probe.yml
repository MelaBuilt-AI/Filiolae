name: native systemd host probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filiolae-native-systemd-containment
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe native systemd and cgroup-v2 boundary
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/filiolae-systemd-host-probe"
          python3 ops/systemd-containment/host_probe.py "$evidence" \
            2>&1 | tee "$RUNNER_TEMP/filiolae-systemd-host-probe.log"
      - name: Package probe evidence
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/filiolae-systemd-host-probe"
          test -f "$evidence/probe-report.json"
          cp "$RUNNER_TEMP/filiolae-systemd-host-probe.log" "$evidence/workflow-console.log"
          find "$evidence" -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/SHA256SUMS.absolute"
          sed "s#  $evidence/#  #" "$evidence/SHA256SUMS.absolute" > "$evidence/SHA256SUMS"
          rm "$evidence/SHA256SUMS.absolute"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/filiolae-systemd-host-probe.tar.gz" \
            filiolae-systemd-host-probe
          sha256sum "$RUNNER_TEMP/filiolae-systemd-host-probe.tar.gz" \
            > "$RUNNER_TEMP/filiolae-systemd-host-probe.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: systemd-host-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/filiolae-systemd-host-probe.tar.gz
            ${{ runner.temp }}/filiolae-systemd-host-probe.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
