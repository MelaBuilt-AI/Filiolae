[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "filiolae"
version = "0.1.0"
description = "Fail-closed governance primitives for automated AI R&D pipelines"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-DOCUMENTATION", "NOTICE", "THIRD_PARTY_LICENSES/*"]
requires-python = ">=3.11,<3.13"
keywords = ["ai-governance", "audit", "machine-learning", "reinforcement-learning", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=45,<47",
    "PyYAML>=6.0.2",
]

[project.urls]
Source = "https://github.com/MelaBuilt-AI/Filiolae"
Documentation = "https://github.com/MelaBuilt-AI/Filiolae/tree/main/docs"
Issues = "https://github.com/MelaBuilt-AI/Filiolae/issues"
Security = "https://github.com/MelaBuilt-AI/Filiolae/security/advisories/new"

[project.scripts]
filiolae = "filiolae.cli:main"
filiolae-prime-rl-orchestrator = "filiolae.prime_rl_entrypoint:governed_orchestrator_main"
filiolae-rl = "filiolae.prime_rl_entrypoint:filiolae_rl_main"
filiolae-candidate-evaluator = "filiolae.paired_eval_worker:main"
filiolae-candidate-replay-evaluator = "filiolae.paired_eval_replay_worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filiolae"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/adapters",
    "/deploy",
    "/scripts",
    "/ops",
    "/interop",
    "/README.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/RELEASE_CHECKLIST.md",
    "/CONTRIBUTING.md",
    "/CLA.md",
    "/COMMERCIAL-LICENSING.md",
    "/ADOPTION.md",
    "/TRADEMARKS.md",
    "/CERTIFICATION.md",
    "/adoption",
    "/CITATION.md",
    "/CITATION.cff",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE*",
    "/NOTICE*",
    "/THIRD_PARTY_LICENSES",
]
exclude = [
    "/.github",
    "/.gitignore",
    "/.gitattributes",
    "/.obsidian",
    "/dist",
    "/build",
    "/.coverage",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
